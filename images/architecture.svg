<svg width="1000" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="650" fill="#020617" />

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748B" />
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
  </defs>

  <!-- ================= PATHS ================= -->
  
  <!-- IoT to Firebase -->
  <path d="M 270 125 L 380 125" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <text x="325" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle">Telemetry</text>

  <!-- Frontend to Backend -->
  <path d="M 270 335 L 380 335" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <text x="325" y="325" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle">REST APIs</text>

  <!-- Backend to AI/ML -->
  <path d="M 610 335 L 720 335" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <text x="665" y="325" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle">Inference</text>

  <!-- Backend to Firebase -->
  <path d="M 500 280 L 500 180" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <text x="510" y="235" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Admin SDK</text>

  <!-- Backend to Ext APIs -->
  <path d="M 610 300 L 670 300 L 670 155 L 720 155" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <text x="680" y="235" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">API Fetch</text>

  <!-- Frontend to Firebase -->
  <path d="M 270 290 L 330 290 L 330 155 L 380 155" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <text x="340" y="225" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Auth &amp; RTDB</text>

  <!-- CI/CD to Backend -->
  <path d="M 500 480 L 500 400" stroke="#475569" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)" />
  <text x="510" y="445" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748B">Automated Deploy</text>

  <!-- CI/CD to Frontend -->
  <path d="M 390 525 L 160 525 L 160 400" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)" />


  <!-- ================= NODES ================= -->

  <!-- IoT Node -->
  <rect x="50" y="80" width="220" height="90" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="2"/>
  <text x="160" y="112" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#38BDF8">IoT &amp; Sensors</text>
  <text x="160" y="137" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#E0F2FE">ESP32 Microcontroller</text>
  <text x="160" y="157" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#E0F2FE">Soil &amp; Temp Sensors</text>

  <!-- Firebase Node -->
  <rect x="390" y="80" width="220" height="90" rx="8" fill="#0F172A" stroke="#EA580C" stroke-width="2"/>
  <text x="500" y="112" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#FB923C">Firebase Cloud</text>
  <text x="500" y="137" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#FFEDD5">Realtime Database</text>
  <text x="500" y="157" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#FFEDD5">Authentication &amp; Firestore</text>

  <!-- External APIs -->
  <rect x="730" y="80" width="220" height="90" rx="8" fill="#0F172A" stroke="#9333EA" stroke-width="2"/>
  <text x="840" y="112" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#C084FC">External APIs</text>
  <text x="840" y="137" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#F3E8FF">OpenWeather API</text>
  <text x="840" y="157" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#F3E8FF">Push Notifications</text>

  <!-- Frontend Node -->
  <rect x="50" y="280" width="220" height="110" rx="8" fill="#0F172A" stroke="#0D9488" stroke-width="2"/>
  <text x="160" y="312" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2DD4BF">Frontend UI</text>
  <text x="160" y="337" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#CCFBF1">React &amp; Vite</text>
  <text x="160" y="357" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#CCFBF1">Tailwind CSS</text>
  <text x="160" y="377" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#CCFBF1">i18next (Tamil/EN)</text>

  <!-- Backend Node -->
  <rect x="390" y="280" width="220" height="110" rx="8" fill="#0F172A" stroke="#16A34A" stroke-width="2"/>
  <text x="500" y="312" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#4ADE80">Core Backend</text>
  <text x="500" y="337" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#DCFCE7">Node.js &amp; Express</text>
  <text x="500" y="357" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#DCFCE7">REST APIs</text>
  <text x="500" y="377" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#DCFCE7">Firebase Admin SDK</text>

  <!-- AI & ML Node -->
  <rect x="730" y="280" width="220" height="110" rx="8" fill="#0F172A" stroke="#DC2626" stroke-width="2"/>
  <text x="840" y="312" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#F87171">AI &amp; ML Models</text>
  <text x="840" y="337" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#FEE2E2">TensorFlow &amp; TF.js</text>
  <text x="840" y="357" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#FEE2E2">Crop Disease Inference</text>
  <text x="840" y="377" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#FEE2E2">Gemini AI Chat</text>

  <!-- CI/CD Node -->
  <rect x="390" y="480" width="220" height="90" rx="8" fill="#0F172A" stroke="#475569" stroke-width="2"/>
  <text x="500" y="512" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#94A3B8">CI/CD &amp; DevOps</text>
  <text x="500" y="537" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#F1F5F9">GitHub Actions Pipelines</text>
  <text x="500" y="557" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#F1F5F9">Docker &amp; GCP Deployment</text>

</svg>
