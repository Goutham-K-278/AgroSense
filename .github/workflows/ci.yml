name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run --prefix frontend build

      - name: Check backend JavaScript syntax
        run: node --check backend/server.js

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python script syntax
        run: |
          python -m py_compile backend/scripts/predict_crop_disease.py
          python -m py_compile backend/scripts/predict_crop_disease_daemon.py
          python -m py_compile backend/scripts/predict_crop_disease_onnx.py
          python -m py_compile backend/scripts/predict_crop_disease_onnx_daemon.py
          python -m py_compile backend/scripts/convert_crop_disease_to_onnx.py

      - name: Build Docker image
        run: docker build -t agrosense:ci .
