version: "3.9"

services:
  agrosense:
    build:
      context: .
      dockerfile: Dockerfile
    image: agrosense:latest
    container_name: agrosense-app
    ports:
      - "5000:5000"
    env_file:
      - backend/.env
    environment:
      DISEASE_INFERENCE_ENGINE: ${DISEASE_INFERENCE_ENGINE:-onnx}
      PYTHON_PATH: python3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 5000) + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
